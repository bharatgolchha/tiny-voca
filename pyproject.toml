[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-voca"
version = "0.2.0"
description = "A 4.5M-parameter two-voice English text-to-speech model trained from scratch"
readme = "README.md"
authors = [{ name = "Muhammed Nazeem" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3", "soundfile>=0.12,<1"]

[project.optional-dependencies]
# The "own" front end: text to phonemes without eSpeak.
own = ["dizione @ git+https://github.com/n4ze3m/dizione"]
prepare = ["librosa>=0.10.2,<2", "pyarrow>=15", "huggingface-hub>=0.34,<2", "scipy>=1.10,<2"]
# Annotation only: the pretrained phoneme recogniser used for forced alignment.
annotate = ["transformers>=4.40,<5", "torchaudio>=2.1,<3", "scipy>=1.10,<2", "huggingface-hub>=0.34,<2"]
# Evaluation only: ASR scoring and comparison with recordings.
evaluate = ["faster-whisper>=1.0,<2", "jiwer>=3,<5", "librosa>=0.10.2,<1", "scipy>=1.10,<2"]
# The scoreboard (tiny_voca.scoreboard): naturalness, word errors and voice similarity.
# On Apple silicon add mlx-whisper; elsewhere faster-whisper is used. UTMOSv2 is installed from git:
#   pip install "git+https://github.com/sarulab-speech/UTMOSv2.git"
score = ["jiwer>=3,<5", "scipy>=1.10,<2", "transformers>=4.40,<5", "pyarrow>=15", "kokoro>=0.9",
         "faster-whisper>=1.0,<2; sys_platform != 'darwin'", "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
tiny-voca-prepare = "tiny_voca.prepare:main"
tiny-voca-annotate = "tiny_voca.annotate:main"
tiny-voca-train = "tiny_voca.train:main"
tiny-voca-vocoder = "tiny_voca.vocoder:main"
tiny-voca-evaluate = "tiny_voca.evaluate:main"
tiny-voca-speak = "tiny_voca.infer:main"
tiny-voca-inspect = "tiny_voca.inspect:main"
tiny-voca-scoreboard = "tiny_voca.scoreboard:main"

[tool.setuptools.packages.find]
where = ["src"]
